appId: dev.dreampia.app
productName: Dreampia-Dev
copyright: Copyright © 2026 Dreampia

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - LICENSE

asar: true
asarUnpack:
  - 'node_modules/better-sqlite3/**'

# === Windows ===
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: 'Dreampia-Dev-${version}-${arch}.${ext}'
  publisherName: 'Dreampia'
  # signing: env vars WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (release.yml 에서 매핑).
  # electron-builder 는 CSC_LINK / CSC_KEY_PASSWORD 를 읽으므로 release.yml
  # 의 windows job 에서만 그 이름으로 export.
  signingHashAlgorithms: ['sha256']
  signDlls: false
  # ★ verifyUpdateCodeSignature: v0.x = false (unsigned 허용),
  #   v1.0+ EV cert 도입 후 true 로 토글. true 시 electron-updater 가
  #   업데이트 서명 검증 강제 → 인증서 변경/만료 시 자동 업데이트 실패.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false                   # full installer (recommended)
  perMachine: false                 # per-user install (no admin)
  allowToChangeInstallationDirectory: true
  artifactName: 'Dreampia-Dev-Setup-${version}-${arch}.${ext}'
  shortcutName: 'Dreampia-Dev'
  uninstallDisplayName: 'Dreampia-Dev ${version}'

# === macOS ===
mac:
  target:
    - target: dmg
      arch: [x64, arm64]   # universal — both Intel + Apple Silicon
    - target: zip          # for auto-updater (electron-updater requirement)
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: 'Dreampia-Dev-${version}-${arch}.${ext}'
  # ★ identity: null → CSC_LINK 없을 때 unsigned build 강제 (v0.x 패턴).
  #   v1.0+ Apple Developer ID 매입 후 identity 항목 제거 + notarize: true.
  #   현재는 unsigned 라 hardenedRuntime / entitlements 모두 무의미하지만
  #   v1.0+ 로 가는 path 명시 위해 그대로 유지.
  identity: null
  hardenedRuntime: true              # required for notarization (v1.0+)
  gatekeeperAssess: false             # allow re-signing
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # ★ notarize: v0.x = false (Apple credentials 없을 때).
  #   v1.0+ Apple Developer Program ($99/년) 가입 후 true.
  #   true 시 release.yml 의 macos job 이 APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  #   + APPLE_TEAM_ID env 사용해 notarytool 호출.
  notarize: false
  # signing: env vars MAC_CSC_LINK + MAC_CSC_KEY_PASSWORD (release.yml 에서 매핑)

dmg:
  sign: false                        # not required (the .app inside is signed)
  artifactName: 'Dreampia-Dev-${version}-${arch}.${ext}'

# === Linux ===
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  artifactName: 'Dreampia-Dev-${version}-${arch}.${ext}'
  # deb 패키지 maintainer 필수 (없으면 fpm 빌드 에러).
  maintainer: 'Dreampia <low@eonofpixel.com>'
  desktop:
    Name: Dreampia-Dev
    Comment: AI coding desktop wrapper
    Categories: Development;IDE;

# === Auto-updater channel meta ===
# release.yml 의 publish job 이 GitHub Release 생성 + asset upload 를 담당.
# electron-builder 의 publish 는 latest.yml / latest-mac.yml / latest-linux.yml
# 형식 결정에만 사용 (실제 업로드는 build artifact 로 → publish job 의 gh CLI).
# v0.1.0 의 race condition (3 OS 동시 release create → 422) 회피용.
#
# provider/owner/repo: electron-updater 가 update channel 식별에 사용 → 유지.
# releaseType: 의미 없음 (release.yml 의 gh CLI 가 직접 결정) — 제거.
publish:
  provider: github
  owner: eonofpixel
  repo: dreampia-dev
