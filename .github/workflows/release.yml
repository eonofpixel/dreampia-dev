name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.1-rc1). Will be checked out — must already exist as a git tag.'
        required: true
        type: string

permissions:
  contents: write # for creating GitHub Releases

concurrency:
  # workflow_dispatch 은 입력 tag 단위, push 는 ref 단위로 직렬화.
  # 다른 release 빌드를 cancel 하지 않음 (mid-build 폐기 방지).
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Stage 1: build per OS, artifact upload only — no GitHub Release creation.
  # 각 OS 가 자기 platform 의 installer/dmg/AppImage 만 빌드해서 artifact 로
  # 올린다. GitHub Release 생성 + asset upload 는 다음 publish job 이 일괄
  # 처리 (race condition 회피 — 이전 패턴은 3 OS 가 동시에 release create 시도해
  # 두번째 OS 부터 422 already_exists 에러로 macOS DMG 누락됐다).
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false # build other OSes even if one fails
      matrix:
        os: [windows-2025-vs2026, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout (push trigger)
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          # Full history for changelog generation (future)
          fetch-depth: 0

      - name: Checkout (manual dispatch tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          # workflow_dispatch.inputs.tag 가 가리키는 ref 를 명시적으로 checkout.
          # 이전엔 input 이 선언만 있고 unused 라 항상 default branch 가 빌드됐다.
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run dev:rebuild

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        # vitest needs Node ABI; rebuild then run
        run: |
          npm run test:rebuild
          npm test
        shell: bash

      - name: Restore Electron ABI for build
        run: npm run dev:rebuild

      # v0.14.0 (A ABI Hardening) — better-sqlite3 native binding 이 Electron
      # ABI 로 정상 컴파일됐는지 sanity check. require() 가 fail 하면 stderr 에
      # NODE_MODULE_VERSION 이 등장 — Electron rebuild 후 Node 로 require 하면
      # 정상 (= 우리는 stderr 에 NODE_MODULE_VERSION 가 보이거나 require 가
      # passes 하는 둘 중 하나면 OK 로 간주). 그 외에 binding 자체가 없거나
      # OS-level dependency 누락이면 build fail.
      - name: Verify native module presence
        run: |
          node -e "const fs=require('fs'); const p='node_modules/better-sqlite3/build/Release/better_sqlite3.node'; if(!fs.existsSync(p)){ console.error('Missing native binding:', p); process.exit(1); } console.log('Binding present:', p, fs.statSync(p).size, 'bytes');"
        shell: bash

      - name: Build Vite (renderer + main + preload)
        run: npx vite build

      # === Per-platform packaging + signing ===
      # ★ KEY CHANGE vs. v0.1.0: --publish never (build artifacts only).
      #   Win/macOS code-signing secrets 는 platform 별로 분리 (공유 X) —
      #   이전 패턴 그대로. 각 OS 가 release/ 디렉토리에 자기 artifact 만
      #   생성한 뒤 actions/upload-artifact 로 다음 stage 에 전달.

      - name: Package (Windows, no publish)
        if: matrix.os == 'windows-2025-vs2026'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Package (macOS, no publish)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Package (Linux, no publish)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload artifacts (per OS)
        uses: actions/upload-artifact@v4
        with:
          name: dreampia-dev-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.dmg
            release/*.dmg.blockmap
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/latest*.yml
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2 (push): collect all OS artifacts → single atomic GitHub Release.
  # publish job 이 끝까지 한 번에 처리하므로 422 already_exists race 없음.
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          # 각 OS artifact 가 별도 dir 로 다운로드됨:
          # release-artifacts/dreampia-dev-windows-2025-vs2026/...
          # release-artifacts/dreampia-dev-macos-latest/...
          # release-artifacts/dreampia-dev-ubuntu-latest/...

      - name: Flatten artifacts into single dir
        run: |
          mkdir -p release-final
          find release-artifacts/ -type f \( \
            -name '*.exe' -o \
            -name '*.exe.blockmap' -o \
            -name '*.dmg' -o \
            -name '*.dmg.blockmap' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.zip' -o \
            -name 'latest*.yml' \
          \) -exec cp {} release-final/ \;
          echo '── release-final/ contents ──'
          ls -la release-final/
        shell: bash

      - name: Extract tag name + version
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          # version 추출 (v0.1.0 → 0.1.0)
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          node scripts/extract-release-notes.cjs "${{ steps.tag.outputs.version }}" > release-notes.md
          echo "Extracted notes ($(wc -l < release-notes.md) lines):"
          head -20 release-notes.md
        shell: bash

      - name: Verify asset completeness
        run: |
          set -e
          cd release-final
          REQUIRED=(
            'Dreampia-Dev-Setup-*-x64.exe'
            'Dreampia-Dev-*-x64.dmg'
            'Dreampia-Dev-*-arm64.dmg'
            'Dreampia-Dev-*-x86_64.AppImage'
            'Dreampia-Dev-*-amd64.deb'
            'latest.yml'
            'latest-mac.yml'
            'latest-linux.yml'
          )
          MISSING=()
          for pattern in "${REQUIRED[@]}"; do
            if ! ls $pattern >/dev/null 2>&1; then
              MISSING+=("$pattern")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required release assets:"
            for p in "${MISSING[@]}"; do
              echo "  - $p"
            done
            exit 1
          fi
          echo "All 8 required assets present."
          ls -la
        shell: bash

      - name: Create GitHub Release + upload all artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.name }} already exists — uploading additional artifacts."
            gh release upload "${{ steps.tag.outputs.name }}" release-final/* \
              --repo ${{ github.repository }} \
              --clobber
          else
            echo "Creating new release ${{ steps.tag.outputs.name }}."
            gh release create "${{ steps.tag.outputs.name }}" release-final/* \
              --repo ${{ github.repository }} \
              --title "${{ steps.tag.outputs.version }}" \
              --notes-file release-notes.md
          fi
        shell: bash

  # ─────────────────────────────────────────────────────────────────────────
  # Stage 2b (workflow_dispatch): artifacts only, no GitHub Release.
  # 진짜 release 발행은 push trigger 만 — dispatch 는 dry-run 검증용.
  # 14일 보존 후 자동 삭제.
  # ─────────────────────────────────────────────────────────────────────────
  artifact-only:
    name: Upload artifacts (manual dispatch)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 5

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List artifacts (sanity check)
        run: |
          find release-artifacts/ -type f -exec ls -la {} \;
          echo '── workflow_dispatch artifacts available in this run for 14 days. ──'
        shell: bash
