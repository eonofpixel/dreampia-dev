name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-test). Will be checked out — must already exist as a git tag.'
        required: true
        type: string

permissions:
  contents: write   # for creating GitHub Releases

concurrency:
  # workflow_dispatch 은 입력 tag 단위, push 는 ref 단위로 직렬화.
  # 다른 release 빌드를 cancel 하지 않음 (mid-build 폐기 방지).
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false   # build other OSes even if one fails
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout (push trigger)
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          # Full history for changelog generation (future)
          fetch-depth: 0

      - name: Checkout (manual dispatch tag)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          # workflow_dispatch.inputs.tag 가 가리키는 ref 를 명시적으로 checkout.
          # 이전엔 input 이 선언만 있고 unused 라 항상 default branch 가 빌드됐다.
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run dev:rebuild

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        # vitest needs Node ABI; rebuild then run
        run: |
          npm run test:rebuild
          npm test
        shell: bash

      - name: Restore Electron ABI for build
        run: npm run dev:rebuild

      - name: Build Vite (renderer + main + preload)
        run: npx vite build

      # === Per-platform packaging + signing ===
      # Win/macOS code-signing secrets are platform-specific so both flows can
      # coexist (이전엔 CSC_LINK / CSC_KEY_PASSWORD 가 공유돼서 한쪽만 가능).
      # 또한 각 OS 가 자기 타겟만 빌드 (--win/--mac/--linux) — universal 빌드보다
      # 빠르고, electron-builder 가 OS 별 native dep 를 자동 처리한다.

      - name: Package + Publish (electron-builder, Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish always

      - name: Package + Publish (electron-builder, macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish always

      - name: Package + Publish (electron-builder, Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --publish always

      - name: Upload artifacts (manual workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dreampia-dev-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.yml
          retention-days: 14
