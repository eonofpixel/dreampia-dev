name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-test)'
        required: true
        type: string

permissions:
  contents: write   # for creating GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # don't cancel a release mid-build

jobs:
  release:
    name: Build + Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false   # build other OSes even if one fails
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for changelog generation (future)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run dev:rebuild

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        # vitest needs Node ABI; rebuild then run
        run: |
          npm run test:rebuild
          npm test
        shell: bash

      - name: Restore Electron ABI for build
        run: npm run dev:rebuild

      - name: Build Vite (renderer + main + preload)
        run: npx vite build

      # === Code signing secrets ===
      # Windows: CSC_LINK (.pfx base64) + CSC_KEY_PASSWORD
      # macOS:   CSC_LINK (.p12 base64) + CSC_KEY_PASSWORD
      #          + APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
      # Linux:   not required
      - name: Package + Publish (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows + macOS code-signing
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --publish always

      - name: Upload artifacts (manual workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dreampia-dev-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
            release/*.yml
          retention-days: 14
